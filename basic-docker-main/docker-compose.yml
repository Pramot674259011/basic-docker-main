services:
  db:
    image: mariadb:latest
    container_name: lemp_mariadb
    volumes:
      - ./mariadb/initdb/:/docker-entrypoint-initdb.d
      - ./mariadb/data/:/var/lib/mysql/
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=sample_db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=1234
    restart: always
    networks:
      - web_network_bank

  php:
    depends_on:
      - db
    build: php/
    container_name: lemp_php
    volumes:
      - ./public_html/:/var/www/html
    expose:
      - "9000"
    restart: always
    networks:
      - web_network_bank

  nginx:
    image: nginx:stable-alpine
    container_name: lemp_nginx
    volumes:
      - ./public_html/:/var/www/html
      - ./nginx/conf/nginx.conf:/etc/nginx/conf/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "8011:80" # เปลี่ยน Port ฝั่งเครื่องคอมเป็น 8080 เพื่อป้องกันปัญหา Port Invalid
    restart: always
    networks:
      - web_network_bank

networks:
  web_network_bank:
    name: lemp
    driver: bridge